<!DOCTYPE html>
<html>
<head>
  <title>SAM Registration</title>

  <style>
    body {
      font-family: Arial;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    #msg {
      margin: 10px 0;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

<h2>SAM Registration</h2>

<div id="msg"></div>

<input id="name" placeholder="Child Name *">
<input id="father" placeholder="Father Name *">

<select id="gender">
  <option value="">Gender *</option>
  <option>Male</option>
  <option>Female</option>
</select>

<input id="dob" type="date">
<input id="admission_date" type="date">
<input id="age" placeholder="Age (months)" readonly>

<input id="contact" placeholder="Contact (11 digits) *">
<input id="village" placeholder="Village *">

<button id="btn">Register</button>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCB_O-ZucL6efwcMXGNOgTmZwccASrFuZI",
  authDomain: "otp-dashboard-3c17e.firebaseapp.com",
  projectId: "otp-dashboard-3c17e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// MESSAGE
function showMsg(text, ok=true){
  const m = document.getElementById("msg");
  m.innerText = text;
  m.style.color = ok ? "green" : "red";
}

// AGE CALCULATION
function calcAge(){
  const dob = document.getElementById("dob").value;
  const adm = document.getElementById("admission_date").value;

  if (!dob || !adm) return;

  let d = new Date(dob);
  let a = new Date(adm);

  let months = (a.getFullYear() - d.getFullYear()) * 12;
  months += (a.getMonth() - d.getMonth());

  document.getElementById("age").value = months;
}

// attach events
document.getElementById("dob").addEventListener("change", calcAge);
document.getElementById("admission_date").addEventListener("change", calcAge);

// BUTTON CLICK
document.getElementById("btn").addEventListener("click", async function(){

  showMsg("Processing...");

  // GET VALUES SAFELY
  let name = document.getElementById("name").value.trim();
  let father = document.getElementById("father").value.trim();
  let gender = document.getElementById("gender").value;
  let contact = document.getElementById("contact").value.trim();
  let village = document.getElementById("village").value.trim();
  let age = document.getElementById("age").value;

  // VALIDATION
  if (!name || !father || !gender){
    showMsg("Fill basic information", false);
    return;
  }

  if (!age || age < 6 || age > 59){
    showMsg("Age must be between 6–59 months", false);
    return;
  }

  if (!/^\d{11}$/.test(contact)){
    showMsg("Contact must be 11 digits", false);
    return;
  }

  if (!village){
    showMsg("Enter village", false);
    return;
  }

  try {

    await db.collection("otp_children").add({
      name: name,
      father: father,
      gender: gender,
      age: age,
      contact: contact,
      village: village,
      createdAt: new Date()
    });

    showMsg("✔ Registration Successful");

    // CLEAR FORM
    document.querySelectorAll("input").forEach(i => i.value = "");
    document.querySelectorAll("select").forEach(s => s.value = "");

  } catch(e) {

    console.error(e);
    showMsg("❌ " + e.message, false);

  }

});

</script>

</body>
</html>
