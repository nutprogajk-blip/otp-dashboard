<!DOCTYPE html>
<html>
<head>
  <title>SAM Registration</title>
  <style>
    body { font-family: Arial; max-width: 500px; margin: auto; padding: 20px; }
    input { width:100%; padding:10px; margin:5px 0; }
    button { width:100%; padding:10px; background:green; color:white; border:none; }
    #msg { margin:10px 0; font-weight:bold; text-align:center; }
  </style>
</head>

<body>

<h2>SAM Registration (TEST)</h2>

<div id="msg"></div>

<input id="name" placeholder="Child Name">
<input id="contact" placeholder="Contact (11 digits)">

<button onclick="save()">Register</button>

<!-- ✅ Firebase v8 ONLY -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// ✅ YOUR REAL CONFIG (already correct)
const firebaseConfig = {
  apiKey: "AIzaSyCB_O-ZucL6efwcMXGNOgTmZwccASrFuZI",
  authDomain: "otp-dashboard-3c17e.firebaseapp.com",
  projectId: "otp-dashboard-3c17e",
  storageBucket: "otp-dashboard-3c17e.firebasestorage.app",
  messagingSenderId: "353305433217",
  appId: "1:353305433217:web:bcebc8860babaa5e48a980"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function showMsg(text, ok=true){
  const m = document.getElementById("msg");
  m.innerText = text;
  m.style.color = ok ? "green" : "red";
}

async function save(){

  console.log("BUTTON CLICKED");
  showMsg("Processing...");

  try {

    if (!name.value){
      showMsg("Enter name", false);
      return;
    }

    if (!/^\d{11}$/.test(contact.value)){
      showMsg("Enter 11 digit contact", false);
      return;
    }

    await db.collection("otp_children").add({
      name: name.value,
      contact: contact.value,
      createdAt: new Date()
    });

    console.log("DATA SAVED");
    showMsg("✔ Registration Successful");

    name.value="";
    contact.value="";

  } catch (e) {
    console.error(e);
    showMsg("❌ " + e.message, false);
  }
}

</script>

</body>
</html>
