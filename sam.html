<!DOCTYPE html>
<html>
<head>
  <title>SAM Registration</title>

  <style>
    body { font-family: Arial; max-width: 500px; margin: auto; padding: 20px; }
    input, select { width:100%; padding:10px; margin:5px 0; }
    button {
      width:100%;
      padding:12px;
      background:green;
      color:white;
      border:none;
      cursor:pointer;
    }
    #msg { margin:10px 0; font-weight:bold; text-align:center; }
  </style>
</head>

<body>

<h2>SAM Registration</h2>

<div id="msg"></div>

<input id="name" placeholder="Child Name *">
<input id="father" placeholder="Father Name *">

<select id="gender">
  <option value="">Gender *</option>
  <option>Male</option>
  <option>Female</option>
</select>

<input id="dob" type="date">
<input id="admission_date" type="date">

<input id="age" placeholder="Age (months)" readonly>

<input id="contact" placeholder="Contact (11 digits)">
<input id="village" placeholder="Village">

<button id="btn">Register</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCB_O-ZucL6efwcMXGNOgTmZwccASrFuZI",
  authDomain: "otp-dashboard-3c17e.firebaseapp.com",
  projectId: "otp-dashboard-3c17e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// MESSAGE
function showMsg(t, ok=true){
  msg.innerText = t;
  msg.style.color = ok ? "green" : "red";
}

// AGE CALCULATION
function calcAge(){
  if (!dob.value || !admission_date.value) return;

  let d = new Date(dob.value);
  let a = new Date(admission_date.value);

  let m = (a.getFullYear()-d.getFullYear())*12;
  m += a.getMonth()-d.getMonth();

  age.value = m;
}

// attach events
document.getElementById("dob").addEventListener("change", calcAge);
document.getElementById("admission_date").addEventListener("change", calcAge);

// SAVE FUNCTION
document.getElementById("btn").addEventListener("click", async function(){

  showMsg("Processing...");

  let n = name.value.trim();
  let f = father.value.trim();
  let g = gender.value;

  if (!n || !f || !g){
    showMsg("Fill basic information", false);
    return;
  }

  if (!dob.value || !admission_date.value){
    showMsg("Enter dates", false);
    return;
  }

  if (age.value < 6 || age.value > 59){
    showMsg("Age must be 6–59 months", false);
    return;
  }

  if (!/^\d{11}$/.test(contact.value.trim())){
    showMsg("Enter valid 11 digit contact", false);
    return;
  }

  try {

    await db.collection("otp_children").add({
      name: n,
      father: f,
      gender: g,
      age: age.value,
      contact: contact.value.trim(),
      createdAt: new Date()
    });

    showMsg("✔ Registration Successful");

  } catch(e){
    console.error(e);
    showMsg("❌ " + e.message, false);
  }

});
</script>

</body>
</html>
