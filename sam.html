<!DOCTYPE html>
<html>
<head>
  <title>SAM Registration</title>
  <style>
    body { font-family: Arial; max-width: 500px; margin:auto; padding:20px; }
    input, select { width:100%; padding:10px; margin:5px 0; }
    button { width:100%; padding:12px; background:green; color:white; cursor:pointer; }
    #msg { margin:10px; text-align:center; font-weight:bold; }
  </style>
</head>

<body>

<h2>SAM Registration</h2>
<div id="msg"></div>

<input id="name" placeholder="Name">
<input id="father" placeholder="Father">
<select id="gender">
  <option value="">Gender</option>
  <option>Male</option>
  <option>Female</option>
</select>

<input id="dob" type="date">
<input id="admission_date" type="date">
<input id="age" readonly placeholder="Age">

<input id="contact" placeholder="Contact (11 digits)">

<button id="btn">Register</button>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCB_O-ZucL6efwcMXGNOgTmZwccASrFuZI",
  authDomain: "otp-dashboard-3c17e.firebaseapp.com",
  projectId: "otp-dashboard-3c17e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function showMsg(t, ok=true){
  msg.innerText = t;
  msg.style.color = ok ? "green" : "red";
}

// AGE
function calcAge(){
  if (!dob.value || !admission_date.value) return;

  let d = new Date(dob.value);
  let a = new Date(admission_date.value);

  let m = (a.getFullYear()-d.getFullYear())*12;
  m += a.getMonth()-d.getMonth();

  age.value = m;
}

dob.onchange = calcAge;
admission_date.onchange = calcAge;

// 🔥 SAFE SAVE (WITH TIMEOUT)
function saveData(data){

  return new Promise((resolve, reject) => {

    let done = false;

    // timeout (5 sec)
    setTimeout(()=>{
      if (!done){
        reject("Network/connection issue");
      }
    }, 5000);

    db.collection("otp_children").add(data)
      .then(res=>{
        done = true;
        resolve(res);
      })
      .catch(err=>{
        done = true;
        reject(err.message);
      });

  });

}

// CLICK
btn.addEventListener("click", async ()=>{

  showMsg("Processing...");

  if (!name.value.trim()){
    showMsg("Enter name", false);
    return;
  }

  try {

    await saveData({
      name: name.value,
      createdAt: new Date()
    });

    showMsg("✔ Registration Successful");

  } catch(e){

    showMsg("❌ " + e, false);

  }

});

</script>

</body>
</html>
