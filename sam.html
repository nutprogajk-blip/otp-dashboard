<!DOCTYPE html>
<html>
<head>
  <title>SAM Registration</title>

  <style>
    body {
      font-family: Arial;
      max-width: 500px;
      margin: auto;
      padding: 10px;
      background: #f5f5f5;
    }

    h2 { text-align: center; }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: green;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 8px;
    }

    .error {
      color: red;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<h2>SAM Registration</h2>

<!-- BASIC -->
<div class="card">
<h3>Basic Information</h3>

<input id="name" placeholder="Child Name *">
<div id="e_name" class="error"></div>

<input id="father" placeholder="Father Name *">
<div id="e_father" class="error"></div>

<select id="gender">
  <option value="">Gender *</option>
  <option>Male</option>
  <option>Female</option>
</select>
<div id="e_gender" class="error"></div>

<label>Date of Birth *</label>
<input id="dob" type="date">
<div id="e_dob" class="error"></div>

<label>Admission Date *</label>
<input id="admission_date" type="date" onchange="calcAge()">
<div id="e_admission_date" class="error"></div>

<input id="age" placeholder="Age (months)" readonly>

<input id="contact" placeholder="Contact Number *">
<div id="e_contact" class="error"></div>

<input id="village" placeholder="Village / Address *">
<div id="e_village" class="error"></div>

</div>

<!-- ADMISSION -->
<div class="card">
<h3>Admission Details</h3>

<input id="muac" type="number" step="0.1" placeholder="MUAC (cm) *">
<div id="e_muac" class="error"></div>

<input id="weight" type="number" step="0.1" placeholder="Weight (kg) *">
<div id="e_weight" class="error"></div>

<input id="height" type="number" step="0.1" placeholder="Height (cm) *">
<div id="e_height" class="error"></div>

<select id="edema">
  <option value="">Edema *</option>
  <option>0</option>
  <option>+</option>
  <option>++</option>
  <option>+++</option>
</select>
<div id="e_edema" class="error"></div>

<select id="appetite">
  <option value="">Appetite Test *</option>
  <option>Pass</option>
  <option>Fail</option>
</select>
<div id="e_appetite" class="error"></div>

</div>

<!-- ADMISSION TYPE -->
<div class="card">
<h3>Admission Type</h3>

<select id="admission_type" onchange="handleAdmissionType()">
  <option value="">Select *</option>
  <option value="new">New Case</option>
  <option value="readmission">Readmission</option>
  <option value="transfer">Transferred from NSC</option>
</select>
<div id="e_admission_type" class="error"></div>

<div id="new_box" class="hidden">
  <select id="new_type">
    <option value="">New Case Type *</option>
    <option>Red MUAC</option>
    <option>Edema</option>
  </select>
</div>

<div id="readmission_box" class="hidden">
  <select id="readmission_type">
    <option value="">Readmission Type *</option>
    <option>Admission after relapse</option>
    <option>Admission after default</option>
    <option>Other</option>
  </select>

  <input id="readmission_other" placeholder="Specify (if Other)" class="hidden">
</div>

</div>

<!-- MEDICAL -->
<div class="card">
<h3>Medical</h3>

<select id="complications" onchange="handleComplications()">
  <option value="">Complications *</option>
  <option>No</option>
  <option>Yes</option>
</select>
<div id="e_complications" class="error"></div>

<input id="complication_detail" placeholder="Specify complication" class="hidden">

</div>

<button onclick="save()">Register</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = { apiKey:"", projectId:"" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function getUser(){
  return JSON.parse(localStorage.getItem("user"));
}

// AGE CALCULATION
function calcAge(){
  const dobVal = new Date(dob.value);
  const admVal = new Date(admission_date.value);

  if (!dobVal || !admVal) return;

  let months = (admVal.getFullYear() - dobVal.getFullYear()) * 12;
  months += admVal.getMonth() - dobVal.getMonth();

  age.value = months;
}

// SHOW/HIDE LOGIC
function handleAdmissionType(){
  new_box.classList.add("hidden");
  readmission_box.classList.add("hidden");

  if (admission_type.value === "new") new_box.classList.remove("hidden");
  if (admission_type.value === "readmission") readmission_box.classList.remove("hidden");
}

function handleComplications(){
  if (complications.value === "Yes"){
    complication_detail.classList.remove("hidden");
  } else {
    complication_detail.classList.add("hidden");
  }
}

// VALIDATION
function validate(){
  let ok = true;

  function err(id,val){
    document.getElementById(id).innerText = val ? "" : "Required";
    if (!val) ok=false;
  }

  err("e_name",name.value);
  err("e_father",father.value);
  err("e_gender",gender.value);
  err("e_dob",dob.value);
  err("e_admission_date",admission_date.value);
  err("e_contact",contact.value);
  err("e_village",village.value);

  err("e_muac",muac.value);
  err("e_weight",weight.value);
  err("e_height",height.value);
  err("e_edema",edema.value);
  err("e_appetite",appetite.value);

  err("e_admission_type",admission_type.value);
  err("e_complications",complications.value);

  if (admission_type.value === "new" && !new_type.value) ok=false;
  if (admission_type.value === "readmission" && !readmission_type.value) ok=false;
  if (readmission_type.value === "Other" && !readmission_other.value) ok=false;

  if (complications.value === "Yes" && !complication_detail.value) ok=false;

  return ok;
}

// GENERATE ID
async function generateSAMId(d,o){
  const id = `SAM-${d.substring(0,3)}-${o.substring(0,3)}`;
  const ref = db.collection("counters").doc(id);
  const doc = await ref.get();
  let n = doc.exists ? doc.data().current_number : 0;
  n++;
  await ref.set({current_number:n},{merge:true});
  return `${d.substring(0,3)}-${o.substring(0,3)}-${String(n).padStart(4,"0")}`;
}

// SAVE
async function save(){

  if (!validate()) return;

  const u = getUser();
  const sam_id = await generateSAMId(u.district,u.otp);

  await db.collection("otp_children").add({

    sam_id,

    name:name.value,
    father:father.value,
    gender:gender.value,
    dob:dob.value,
    age:age.value,

    contact:contact.value,
    village:village.value,

    district:u.district,
    otp:u.otp,

    admission:{
      date:admission_date.value,
      muac:muac.value,
      weight:weight.value,
      height:height.value,
      edema:edema.value,
      appetite:appetite.value,

      type:admission_type.value,
      new_type:new_type.value,
      readmission_type:readmission_type.value,
      readmission_other:readmission_other.value
    },

    medical:{
      complications:complications.value,
      detail:complication_detail.value
    },

    status:"active",
    createdAt:new Date()

  });

  alert("Registered: "+sam_id);
}
</script>

</body>
</html>
