<!DOCTYPE html>
<html>
<head>
  <title>SAM Registration</title>

  <style>
    body {
      font-family: Arial;
      max-width: 500px;
      margin: auto;
      padding: 10px;
      background: #f5f5f5;
    }

    h2 { text-align: center; }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: green;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 8px;
    }

    .error { color: red; font-size: 12px; }
    .hidden { display: none; }
  </style>
</head>

<body>

<h2>SAM Registration</h2>

<div class="card">
<h3>Basic Information</h3>

<input id="name" placeholder="Child Name *">
<div id="e_name" class="error"></div>

<input id="father" placeholder="Father Name *">
<div id="e_father" class="error"></div>

<select id="gender">
  <option value="">Gender *</option>
  <option>Male</option>
  <option>Female</option>
</select>
<div id="e_gender" class="error"></div>

<label>Date of Birth *</label>
<input id="dob" type="date">

<label>Admission Date *</label>
<input id="admission_date" type="date" onchange="calcAge()">

<input id="age" placeholder="Age (months)" readonly>

<input id="contact" placeholder="Contact Number *">
<div id="e_contact" class="error"></div>

<input id="village" placeholder="Village / Address *">
<div id="e_village" class="error"></div>

</div>

<div class="card">
<h3>Admission Details</h3>

<input id="muac" type="number" placeholder="MUAC *">
<input id="weight" type="number" placeholder="Weight *">
<input id="height" type="number" placeholder="Height *">

<select id="edema">
  <option value="">Edema *</option>
  <option>0</option>
  <option>+</option>
  <option>++</option>
  <option>+++</option>
</select>

<select id="appetite">
  <option value="">Appetite *</option>
  <option>Pass</option>
  <option>Fail</option>
</select>
</div>

<div class="card">
<h3>Admission Type</h3>

<select id="admission_type" onchange="handleAdmissionType()">
  <option value="">Select *</option>
  <option value="new">New Case</option>
  <option value="readmission">Readmission</option>
  <option value="transfer">Transfer</option>
</select>

<div id="new_box" class="hidden">
  <select id="new_type">
    <option value="">New Type *</option>
    <option>Red MUAC</option>
    <option>Edema</option>
  </select>
</div>

<div id="readmission_box" class="hidden">
  <select id="readmission_type">
    <option value="">Readmission *</option>
    <option>Relapse</option>
    <option>Default</option>
    <option>Other</option>
  </select>

  <input id="readmission_other" placeholder="Specify" class="hidden">
</div>
</div>

<div class="card">
<h3>Medical</h3>

<select id="complications" onchange="handleComplications()">
  <option value="">Complications *</option>
  <option>No</option>
  <option>Yes</option>
</select>

<input id="complication_detail" placeholder="Specify" class="hidden">
</div>

<button onclick="save()">Register</button>

<!-- ✅ FIXED FIREBASE (v8) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// 🔴 PUT YOUR REAL CONFIG HERE
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  projectId: "otp-dashboard"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// AGE
function calcAge(){
  if (!dob.value || !admission_date.value) return;

  const d = new Date(dob.value);
  const a = new Date(admission_date.value);

  if (a < d) {
    alert("Invalid dates");
    return;
  }

  let m = (a.getFullYear() - d.getFullYear()) * 12;
  m += a.getMonth() - d.getMonth();

  age.value = m;
}

// UI LOGIC
function handleAdmissionType(){
  new_box.classList.add("hidden");
  readmission_box.classList.add("hidden");

  if (admission_type.value==="new") new_box.classList.remove("hidden");
  if (admission_type.value==="readmission") readmission_box.classList.remove("hidden");
}

function handleComplications(){
  if (complications.value==="Yes") {
    complication_detail.classList.remove("hidden");
  } else {
    complication_detail.classList.add("hidden");
  }
}

// VALIDATION
function validate(){

  if (!name.value || !father.value || !gender.value) return alert("Basic info missing"),false;

  if (!dob.value || !admission_date.value) return alert("Dates missing"),false;

  if (age.value < 6 || age.value > 59)
    return alert("Age must be 6–59 months"),false;

  if (!/^\d{11}$/.test(contact.value))
    return alert("Enter 11 digit contact"),false;

  if (!muac.value || !weight.value || !height.value)
    return alert("Measurements missing"),false;

  if (!edema.value || !appetite.value)
    return alert("Clinical info missing"),false;

  if (!admission_type.value)
    return alert("Select admission type"),false;

  if (admission_type.value==="new" && !new_type.value)
    return alert("Select new case type"),false;

  if (admission_type.value==="readmission" && !readmission_type.value)
    return alert("Select readmission type"),false;

  if (complications.value==="Yes" && !complication_detail.value)
    return alert("Specify complication"),false;

  return true;
}

// SAVE
async function save(){

  console.log("SAVE CLICKED");

  if (!validate()) return;

  try{

    await db.collection("otp_children").add({
      name:name.value,
      father:father.value,
      gender:gender.value,
      age:age.value,
      contact:contact.value,
      village:village.value,
      createdAt:new Date()
    });

    alert("✅ Registered Successfully");

  } catch(e){
    console.error(e);
    alert("Error: "+e.message);
  }
}

</script>

</body>
</html>
