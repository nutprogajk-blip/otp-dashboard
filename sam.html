<!DOCTYPE html>
<html>
<head>
  <title>SAM Test</title>

  <style>
    body { font-family: Arial; padding: 20px; }
    button {
      padding: 10px;
      background: green;
      color: white;
      border: none;
      cursor: pointer; /* 🔥 forces hand cursor */
    }
    #msg { margin-top: 10px; font-weight: bold; }
  </style>
</head>

<body>

<h2>Test Button</h2>

<input id="name" placeholder="Name"><br><br>

<button id="btn">Register</button>

<div id="msg"></div>

<script>

// 🔥 FORCE BUTTON CLICK
document.getElementById("btn").addEventListener("click", function(){
  document.getElementById("msg").innerText = "✅ BUTTON WORKING";
});

</script>

</body>
</html>
