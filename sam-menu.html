<!DOCTYPE html>
<html>
<head>
  <title>SAM Module</title>

  <style>
    body { font-family: Arial; max-width: 800px; margin:auto; padding:15px; background:#f4f4f4;}
    .card { background:white; padding:15px; margin-bottom:15px; border-radius:8px;}
    input, select { width:100%; padding:10px; margin:5px 0; }
    button { width:100%; padding:12px; margin-top:5px; cursor:pointer; }
    #msg { text-align:center; font-weight:bold; margin-bottom:10px; }
    .hidden { display:none; }
  </style>
</head>

<body>

<h2>SAM Module</h2>
<div id="msg"></div>

<!-- MENU -->
<div class="card">
  <button onclick="goRegister()">1. Register New SAM Case</button>
  <button onclick="showSearch()">2. Search Existing Case</button>
</div>

<!-- SEARCH -->
<div id="searchBox" class="card hidden">
  <input id="search_id" placeholder="Enter Child ID">
  <button onclick="searchChild()">Search</button>
</div>

<!-- FULL FORM (REUSED) -->
<div id="formSection" class="card hidden">

<h3>SAM Case Form</h3>

<input id="name" placeholder="Child Name">
<input id="father" placeholder="Father Name">

<select id="gender">
  <option value="">Gender</option>
  <option>Male</option>
  <option>Female</option>
</select>

<input id="dob" type="date">
<input id="admission_date" type="date">
<input id="age" readonly>

<input id="contact" placeholder="Contact">
<input id="village" placeholder="Village">

<input id="muac" placeholder="MUAC">
<input id="weight" placeholder="Weight">
<input id="height" placeholder="Height">

<select id="edema">
  <option value="">Edema</option>
  <option>0</option><option>+</option><option>++</option><option>+++</option>
</select>

<select id="appetite">
  <option value="">Appetite</option>
  <option>Pass</option><option>Fail</option>
</select>

<select id="admission_type">
  <option value="">Admission Type</option>
  <option>New - Red MUAC</option>
  <option>New - Edema</option>
  <option>Readmission - Relapse</option>
  <option>Readmission - Default</option>
  <option>Other</option>
  <option>Transfer from NSC</option>
</select>

<select id="complications">
  <option value="">Complications</option>
  <option>No</option>
  <option>Yes</option>
</select>

<input id="complication_detail" placeholder="If yes, specify">

<button id="updateBtn" onclick="updateCase()">Update Case</button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCB_O-ZucL6efwcMXGNOgTmZwccASrFuZI",
  authDomain: "otp-dashboard-3c17e.firebaseapp.com",
  projectId: "otp-dashboard-3c17e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentDocId = null;

function showMsg(t, ok=true){
  msg.innerText = t;
  msg.style.color = ok ? "green" : "red";
}

function goRegister(){
  window.location.href="sam.html";
}

function showSearch(){
  searchBox.classList.remove("hidden");
}

// SEARCH + FILL FORM
async function searchChild(){

  let id = search_id.value.trim().toUpperCase();

  if (!id) return showMsg("Enter ID", false);

  let snap = await db.collection("otp_children")
    .where("child_id","==",id)
    .get();

  if (snap.empty) return showMsg("Not found", false);

  snap.forEach(doc=>{
    currentDocId = doc.id;
    let d = doc.data();

    // FILL FORM
    name.value = d.name;
    father.value = d.father;
    gender.value = d.gender;
    dob.value = d.dob;
    admission_date.value = d.admission_date;
    age.value = d.age;
    contact.value = d.contact;
    village.value = d.village;
    muac.value = d.muac;
    weight.value = d.weight;
    height.value = d.height;
    edema.value = d.edema;
    appetite.value = d.appetite;
    admission_type.value = d.admission_type;
    complications.value = d.complications;
    complication_detail.value = d.complication_detail;
  });

  formSection.classList.remove("hidden");

  showMsg("✔ Data Loaded");
}

// UPDATE
async function updateCase(){

  await db.collection("otp_children").doc(currentDocId).update({
    name: name.value,
    father: father.value,
    gender: gender.value,
    dob: dob.value,
    admission_date: admission_date.value,
    age: age.value,
    contact: contact.value,
    village: village.value,
    muac: muac.value,
    weight: weight.value,
    height: height.value,
    edema: edema.value,
    appetite: appetite.value,
    admission_type: admission_type.value,
    complications: complications.value,
    complication_detail: complication_detail.value
  });

  showMsg("✔ Case Updated Successfully");
}

</script>

</body>
</html>
